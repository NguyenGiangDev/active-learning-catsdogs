# .github/workflows/cicd.yml
# CI/CD/CT pipeline cho dự án Active Learning Cats vs Dogs
#
# Jobs:
#   1. test            — chạy pytest khi push / PR
#   2. build-and-push  — build Docker image và push lên Docker Hub (sau khi test pass)
#   3. retrain         — kích hoạt khi:
#                          a) Thủ công qua "Run workflow" trên GitHub UI
#                          b) Tự động từ label-web service gửi repository_dispatch
#                             event "retrain-requested" khi đủ RETRAIN_THRESHOLD
#   4. deploy          — deploy lên self-hosted runner sau khi build thành công

name: MLOPS pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      retrain_only:
        description: "Chỉ chạy job retrain (bỏ qua test/build)?"
        required: false
        default: "false"
      dataset_version:
        description: "Dataset version tag để retrain (vd: dataset-v2). Để trống = dùng version mới nhất"
        required: false
        default: ""
  # ── Trigger tự động từ label-web ──────────────────────────────────────────
  # label-web gọi POST https://api.github.com/repos/{owner}/{repo}/dispatches
  # với body: { "event_type": "retrain-requested", "client_payload": {...} }
  # Yêu cầu: GITHUB_TOKEN secret phải có quyền `repo` hoặc `workflow`.
  repository_dispatch:
    types: [retrain-requested]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Test
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Run pytest
    runs-on: self-hosted
    # Bỏ qua job này nếu trigger là dispatch thuần (retrain_only=true)
    # hoặc là repository_dispatch từ label-web (không cần test lại)
    if: >
      github.event_name != 'repository_dispatch' &&
      github.event.inputs.retrain_only != 'true'

    steps:
      # Fix: Docker container có thể tạo file/dir owned bởi root
      # → chown lại workspace trước khi checkout để tránh EACCES error
      - name: Fix workspace permissions
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@v5

      - name: Setup data directories
        run: mkdir -p data/low_confidence

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Không dùng cache: "pip" trên self-hosted runner!
          # ~/.cache/pip đã tự động persist trên đĩa local giữa các lần chạy.
          # Dùng GitHub remote cache sẽ download 4+ GB mỗi lần → chậm hơn nhiều.

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build & Push Docker image
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    # Chỉ chạy khi push vào main (không chạy khi PR, retrain_only, hay repository_dispatch)
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.retrain_only != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # Nhớ thêm DOCKERHUB_USERNAME và DOCKERHUB_TOKEN vào
          # Settings → Secrets and variables → Actions trong repo của bạn.
          # Không bao giờ hardcode credentials vào file này.
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push catdog-classifier image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/catdog-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/catdog-classifier:${{ github.sha }}
          # Lưu cache layer vào Docker Hub → truy cập được từ mọi CI runner
          # Migrate sang S3: đổi 2 dòng dưới thành type=s3,bucket=...,region=...
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/catdog-classifier:cache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/catdog-classifier:cache,mode=max

      - name: Build and push label-web image
        uses: docker/build-push-action@v5
        with:
          context: label-web/
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/label-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/label-web:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/label-web:cache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/label-web:cache,mode=max
  # ─────────────────────────────────────────────────────────────────
  # Job 3: Retrain
  #
  # Được trigger bởi:
  #   a) workflow_dispatch thủ công (GitHub UI hoặc gh CLI)
  #   b) repository_dispatch từ label-web service khi đủ ngưỡng nhãn
  #      event_type: "retrain-requested"
  #      client_payload: { labeled_count, threshold, triggered_at }
  #
  # Để cấu hình label-web gọi GitHub dispatch:
  #   1. Tạo Personal Access Token với quyền `repo` (hoặc Fine-grained: `contents: write`)
  #   2. Thêm vào .env hoặc docker secrets:
  #        GITHUB_TOKEN=ghp_xxxxx
  #        GITHUB_REPO_OWNER=<your-username>
  #        GITHUB_REPO_NAME=active-learning-catsdogs
  #   3. Restart container label-web
  # ─────────────────────────────────────────────────────────────────
  retrain:
    name: Retrain model
    runs-on: ubuntu-latest
    # Chạy khi: dispatch thủ công HOẶC repository_dispatch từ label-web
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    # ── DVC remote: mặc định localremote, đổi thành s3remote khi deploy AWS
    # Set tại: GitHub repo → Settings → Variables → DVC_REMOTE = s3remote
    env:
      DVC_REMOTE: ${{ vars.DVC_REMOTE || 'localremote' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Log retrain trigger info
        run: |
          echo "══════════════════════════════════════════════"
          echo "🔥 Retrain job được trigger!"
          echo "  Trigger:    ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "  Labeled:    ${{ github.event.client_payload.labeled_count }}"
            echo "  Threshold:  ${{ github.event.client_payload.threshold }}"
            echo "  Triggered:  ${{ github.event.client_payload.triggered_at }}"
          fi
          echo "══════════════════════════════════════════════"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # pip cache được lưu bởi actions/setup-python (cache: pip ở trên)
        # Lần chạy sau sẽ hit cache, không tải lại torch từ PyPI
        run: pip install -r requirements.txt

      # ── Bước A: Restore đúng version dataset ────────────────────────────────
      # Nếu user truyền dataset_version (vd: dataset-v2) → checkout con trỏ
      # data/raw.dvc của version đó. Để trống → dùng version mới nhất (HEAD).
      - name: 📥 Restore dataset version
        run: |
          VERSION="${{ github.event.inputs.dataset_version }}"
          if [ -n "$VERSION" ]; then
            echo "⏪ Checkout dataset version: $VERSION"
            git fetch --tags
            git checkout "$VERSION" -- data/raw.dvc
            echo "✅ data/raw.dvc khôi phục từ tag: $VERSION"
          else
            echo "✅ Dùng dataset version mới nhất (HEAD)"
          fi

      # ── Bước B: dvc pull — download ảnh thật từ remote về data/raw/ ──────────
      # Không có bước này, data/raw/ trống → train bị crash.
      # Local remote: đường dẫn tương đối ../../catdog-dvc-storage
      # S3 remote   : đọc AWS credentials từ env var / IAM Role tự động
      - name: 📦 Pull data từ DVC remote
        run: |
          echo "[dvc] Pulling từ remote: $DVC_REMOTE"
          dvc pull --remote "$DVC_REMOTE" || \
            echo "⚠️  dvc pull bỏ qua (local demo — data/raw đã tồn tại trên runner)"

      # ── Bước C: Data Validation ──────────────────────────────────────────────
      # Exit code ≠ 0 → pipeline dừng, KHÔNG retrain với dữ liệu xấu.
      - name: ✅ Data Validation
        run: python -m train.validate_data --data-dir data/raw

      # ── Bước D: Data Versioning (snapshot trước khi train) ───────────────────
      # Tạo git tag dataset-v{N}, cập nhật data/raw.dvc, push lên DVC remote.
      # Chỉ chạy khi retrain với version mới nhất (không snapshot lại version cũ).
      - name: 📌 Data Versioning (DVC snapshot)
        if: github.event.inputs.dataset_version == ''
        run: |
          python -m train.version_data \
            --data-dir data/raw \
            --run-id "${{ github.sha }}" \
            --dvc-remote "$DVC_REMOTE"

      # ── Bước E: Retrain ───────────────────────────────────────────────────────
      - name: 🚀 Chạy retrain
        run: python -m train.train --data-dir data/raw --epochs 5

      - name: 💾 Commit model mới vào DVC
        run: |
          # Ghi chú: Trong CI thật, dùng DVC remote S3/GCS.
          # Với demo local remote, bước này chỉ in thông báo.
          echo "[retrain] dvc add models && dvc push --remote $DVC_REMOTE (bỏ qua trong demo)"

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Deploy
  # Chạy tự động sau khi build-and-push thành công (push vào main).
  # Yêu cầu: self-hosted runner đang chạy trên máy WSL local.
  #
  # Cách cài self-hosted runner:
  #   GitHub repo → Settings → Actions → Runners → New self-hosted runner
  #   Chọn Linux → chạy các lệnh cài đặt trên WSL
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (self-hosted WSL)
    runs-on: self-hosted
    needs: [build-and-push]
    # Chỉ deploy khi push vào main (không chạy khi PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Fix: tương tự job test, chown lại workspace trước checkout
      - name: Fix workspace permissions
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@v5

      - name: Pull image catdog-classifier
        # Retry 3 lần để xử lý lỗi mạng tạm thời (TLS timeout, IPv6 fallback)
        run: |
          for i in 1 2 3; do
            docker pull nguyengiangdevops/catdog-classifier:latest && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Build label-web image
        run: |
          for i in 1 2 3; do
            docker pull nguyengiangdevops/label-web:latest && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Restart containers với image mới
        # --no-build cho api (dùng image vừa pull)
        # --force-recreate: đảm bảo container dùng image mới nhất
        run: docker compose up -d --force-recreate