# docker-compose.yml
# Hai service: FastAPI classifier + Label Web UI để gán nhãn ảnh bất định.
#
# Cách dùng:
#   docker compose up -d
#   - API:       http://localhost:8000
#   - Label Web: http://localhost:4000
#
# Lưu ý: label-web mount ./data vào /app/data để đọc ảnh từ low_confidence/
#         và lưu kết quả vào labeled/ & retrain_trigger/.
#
# Retrain trigger:
#   Khi đủ RETRAIN_THRESHOLD ảnh được gán nhãn, label-web sẽ:
#   1. Tạo file data/retrain_trigger/trigger_{timestamp}.json
#   2. Gọi GitHub API repository_dispatch event "retrain-requested"
#      (cần cấu hình GITHUB_TOKEN, GITHUB_REPO_OWNER, GITHUB_REPO_NAME)

services:
  api:
    image: nguyengiangdevops/catdog-classifier:latest
    container_name: catdog-api
    ports:
      - "8000:8000"
    volumes:
      # Mount data để ảnh low_confidence được ghi vào host
      - ./data:/app/data
      # Mount models để có thể swap model mà không rebuild image
      - ./models:/app/models
    environment:
      - LOW_CONFIDENCE_DIR=/app/data/low_confidence
      - CONFIDENCE_THRESHOLD=0.80
    restart: unless-stopped

  label-web:
    image: nguyengiangdevops/label-web:latest
    container_name: label-web
    ports:
      - "4000:4000"
    volumes:
      # Mount toàn bộ data: đọc low_confidence, ghi labeled & retrain_trigger
      - ./data:/app/data
    # Chạy as root để tránh mọi EACCES với bind mount trên local/self-hosted.
    # (Trên ECS/EKS production dùng IAM Role + EFS Access Point thay thế)
    user: "root"
    environment:
      - PORT=4000
      - LOW_CONFIDENCE_DIR=/app/data/low_confidence
      - LABELED_DIR=/app/data/labeled
      - RETRAIN_TRIGGER_DIR=/app/data/retrain_trigger
      - RAW_DATA_DIR=/app/data/raw
      # Số ảnh label tối thiểu để trigger retrain
      - RETRAIN_THRESHOLD=10
      # GitHub dispatch để trigger CI/CD retrain job tự động
      # Thêm vào file .env hoặc docker secrets khi deploy thật:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-}
    restart: unless-stopped
    depends_on: []
